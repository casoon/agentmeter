/text></g><g id="r44"><text x="0" y="13.5" textLength="806.4">ache (promptCacheTtl) may reduce rewrites, but its writes cost more, so compare before switching</text></g><g id="r45"><text x="16.8" y="13.5" textLength="898.8" class="c2">baseline-load v1 not measurable: only 1 clean session starts (5 needed); 0 resumed or forked, 0 without log</text></g><g id="r46"><text x="0" y="13.5" textLength="42" class="c2">start</text></g><g id="r47"><text x="16.8" y="13.5" textLength="739.2" class="c2">compact-thrash v1 checked, nothing to report: no automatic compaction pair in the period</text></g><g id="r48"><text x="16.8" y="13.5" textLength="907.2" class="c2">big-context v2 checked, nothing to report: 0 of 4 requests above 500k (0.0 % of tokens, below 10 %); largest</text></g><g id="r49"><text x="8.4" y="13.5" textLength="100.8" class="c2">context 120k</text></g><g id="r50"><text x="16.8" y="13.5" textLength="798" class="c2">long-session v1 checked, nothing to report: 0 of 1 sessions span more than 24 h (longest 0.5 h)</text></g><g id="r51"><text x="0" y="13.5" textLength="294" class="c2">Data: observed 2026-10-28T12:00:05Z</text><text x="302.4" y="13.5" class="c2">–</text><text x="319.2" y="13.5" textLength="168" class="c2">2026-10-28T12:30:00Z</text></g><g id="r52"><text x="16.8" y="13.5" textLength="285.6" class="c2">Read 2 files, 10 lines, 4 requests</text><text x="310.8" y="13.5" class="c2">·</text><text x="327.6" y="13.5" textLength="126" class="c2">version 2.1.309</text></g><g id="r53"><text x="16.8" y="13.5" textLength="445.2" class="c2">0 duplicate lines merged, 1 sub-agent replays dropped</text></g><g id="r54"><text x="16.8" y="13.5" textLength="310.8" class="c2">unknown entry types: future-event (1)</text></g><g id="r55"><text x="16.8" y="13.5" textLength="310.8" class="c2">unknown usage fields: new_counter (1)</text></g></defs><rect width="948" height="620" rx="8" fill="#1e1e2e"/><path d="M0 8a8 8 0 0 1 8-8h932a8 8 0 0 1 8 8v24H0z" fill="#2c2d3e"/><circle cx="18
# Recorded with `castwright build findings.terminal.yaml --allow-exec --record` (castwright 0.5.2),
# run in examples/ with CLAUDE_CONFIG_DIR=demo-logs (synthetic logs, written for this demo) and
# tests/fixtures/probe/claude on the PATH as `claude` (a recorded, shortened /context answer).
# SVG export: `castwright build findings.terminal.yaml --format svg -o ../.github/readme --loop-delay 4000`
# The closing `wait` holds the finished screen, the loop delay adds to it.
